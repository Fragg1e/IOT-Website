<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Pollution Averages</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f9;
    }

    header, footer {
      background: #004466;
      color: white;
      text-align: center;
      padding: 1rem;
    }

    main {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }

    h2 {
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .box {
      background: white;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .box h3 {
      margin-bottom: 0.5rem;
    }

    .box p {
      font-size: 1.4rem;
      margin: 0;
    }

    
  </style>
</head>
<body>

  <header>
    <h1>Air Pollution Sensor</h1>
  </header>

  <main>
    <h2>Average Readings</h2>
    <div id="grid" class="grid">Loading...</div>
  </main>

  <br><br><br><br><br><br><br><br>


  <footer>
    <p>&copy; 2025 College Project</p>
  </footer>

  <script>
    fetch("data/air_pollution_data.csv")
      .then(res => res.text())
      .then(csv => {
        Papa.parse(csv, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            showAverages(results.data);
          }
        });
      })
      .catch(err => {
        document.getElementById("grid").innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
      });

    function showAverages(data) {
      const grid = document.getElementById("grid");
      const keys = Object.keys(data[0]);
      const averages = {};

      keys.forEach(key => {
        const nums = data.map(row => parseFloat(row[key]) || 0);
        const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
        averages[key] = avg.toFixed(2);
      });

      grid.innerHTML = keys.map(key => `
        <div class="box">
          <h3>${key}</h3>
          <p>${averages[key]}</p>
        </div>
      `).join('');
    }
  </script>

</body>
</html>
